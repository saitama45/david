name: Deploy Laravel to Azure App Service

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: fileinfo, mbstring, xml, gd, zip, pdo_sqlsrv, sqlsrv
          ini-values: post_max_size=256M, max_execution_time=180
          tools: composer:v2

      # 1. Cache Composer dependencies
      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      # 2. Cache NPM dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Create Storage Link
        run: php artisan storage:link

      - name: Prepare Deployment Artifact
        run: |
          mkdir -p build_output
          rsync -ar . build_output/ \
            --exclude build_output \
            --exclude node_modules \
            --exclude .git \
            --exclude tests \
            --exclude resources/js \
            --exclude resources/css \
            --exclude storage/logs \
            --exclude "storage/framework/cache/data"

          # Ensure storage framework directories exist with a placeholder so FTP uploads them
          mkdir -p build_output/storage/framework/cache/data
          mkdir -p build_output/storage/framework/sessions
          mkdir -p build_output/storage/framework/views
          mkdir -p build_output/storage/logs
          touch build_output/storage/framework/cache/data/index.html
          touch build_output/storage/framework/sessions/index.html
          touch build_output/storage/framework/views/index.html
          touch build_output/storage/logs/index.html

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-app
          path: build_output/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-app
          path: .

      # 3. Deploy to Azure
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'David'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      # 4. Deploy to FTP hosting
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_SITE10 }}
          username: ${{ secrets.FTP_USERNAME_SITE10 }}
          password: ${{ secrets.FTP_PASSWORD_SITE10 }}
          protocol: ftp
          port: 21
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
