name: Deploy Laravel to Azure App Service

on:
  push:
    branches:
      - master
  # Manual "Run workflow" button, for redeploying a commit that never got a run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: fileinfo, mbstring, xml, gd, zip, pdo_sqlsrv, sqlsrv
          ini-values: post_max_size=256M, max_execution_time=180
          tools: composer:v2

      # vendor/ is committed, so this only strips the dev packages. A Composer
      # cache never had anything to restore and is deliberately not used.
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies & Build
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      - name: Create Storage Link
        run: php artisan storage:link

      - name: Prepare Deployment Artifact
        run: |
          mkdir -p build_output
          rsync -ar . build_output/ \
            --exclude build_output \
            --exclude node_modules \
            --exclude .git \
            --exclude tests \
            --exclude resources/js \
            --exclude resources/css \
            --exclude storage/logs \
            --exclude "storage/framework/cache/data"

          # Ensure storage framework directories exist with a placeholder so FTP uploads them
          mkdir -p build_output/storage/framework/cache/data
          mkdir -p build_output/storage/framework/sessions
          mkdir -p build_output/storage/framework/views
          mkdir -p build_output/storage/logs
          touch build_output/storage/framework/cache/data/index.html
          touch build_output/storage/framework/sessions/index.html
          touch build_output/storage/framework/views/index.html
          touch build_output/storage/logs/index.html

      # One file instead of ~44k: uploading the folder as-is spent ~30s on the
      # per-file artifact upload alone. The FTP package keeps its full content -
      # FTP-Deploy-Action deletes whatever disappears from it, and removing the
      # Google API clients there would cost one very long deletion run.
      - name: Create FTP Package
        run: tar -cf ftp.tar -C build_output .

      - name: Upload FTP Package
        uses: actions/upload-artifact@v4
        with:
          name: ftp-package
          path: ftp.tar
          compression-level: 0
          retention-days: 1

      # google/apiclient-services ships a client for every Google API: ~31k of the
      # ~44k files in the package, while the app only uses Google\Service\Drive.
      # Azure extracts the zip file by file onto its network share, so those files
      # alone made the Azure deploy take ~10 minutes on every run.
      - name: Remove unused Google API clients from the Azure package
        run: |
          cd build_output/vendor/google/apiclient-services/src
          find . -mindepth 1 -maxdepth 1 ! -name Drive ! -name Drive.php -exec rm -rf {} +
          cd "$GITHUB_WORKSPACE"
          # Rebuild the optimized classmap so it no longer lists the removed files.
          composer dump-autoload --working-dir=build_output --optimize --no-dev --no-scripts --no-interaction
          echo "Files in Azure package: $(find build_output -type f | wc -l)"

      - name: Create Azure Zip Package
        run: |
          cd build_output
          zip -qr ../app.zip .

      - name: Upload Azure Package
        uses: actions/upload-artifact@v4
        with:
          name: azure-package
          path: app.zip
          compression-level: 0
          retention-days: 1

  deploy_azure:
    name: Deploy to Azure App
    needs: build
    runs-on: ubuntu-latest
    # Locks are per target, never workflow-wide, so a slow FTP sync cannot hold
    # back the next Azure deploy. cancel-in-progress must stay false: cancelling
    # the runner does NOT cancel a deployment already running on Azure's side, so
    # the next run's OneDeploy would hit a 409 Conflict.
    concurrency:
      group: deploy-azure
      cancel-in-progress: false

    steps:
      - name: Download Azure Package
        uses: actions/download-artifact@v4
        with:
          name: azure-package
          path: .

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'David'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

  deploy_ftp:
    name: Deploy to FTP
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ftp-site10
      cancel-in-progress: false

    steps:
      - name: Download FTP Package
        uses: actions/download-artifact@v4
        with:
          name: ftp-package
          path: .

      - name: Extract FTP Package
        run: |
          mkdir -p ftp_output
          tar -xf ftp.tar -C ftp_output

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_SITE10 }}
          username: ${{ secrets.FTP_USERNAME_SITE10 }}
          password: ${{ secrets.FTP_PASSWORD_SITE10 }}
          protocol: ftp
          port: 21
          timeout: 120000
          # Same content and the action's default sync-state file as before, so
          # only changed files are sent and nothing is deleted on the server.
          local-dir: ./ftp_output/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
